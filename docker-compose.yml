services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api_gateway:
    build: ./api_gateway
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./api_gateway:/app
    depends_on:
      - postgres
      - identity_service

  identity_service:
    build: ./identity_service
    ports:
      - "8001:8000"
    env_file:
      - .env
    volumes:
      - ./identity_service:/app
    depends_on:
      - postgres

  patient_service:
    build: ./patient_service
    ports:
      - "8002:8000"
    env_file:
      - .env
    volumes:
      - ./patient_service:/app
    depends_on:
      - postgres

  provider_service:
    build: ./provider_service
    ports:
      - "8003:8000"
    env_file:
      - .env
    volumes:
      - ./provider_service:/app
    depends_on:
      - postgres

  appointment_service:
    build: ./appointment_service
    ports:
      - "8004:8000"
    env_file:
      - .env
    volumes:
      - ./appointment_service:/app
    depends_on:
      - postgres

  consultation_service:
    build: ./consultation_service
    ports:
      - "8005:8000"
    env_file:
      - .env
    volumes:
      - ./consultation_service:/app
    depends_on:
      - postgres

  medical_record_service:
    build: ./medical_record_service
    ports:
      - "8006:8000"
    env_file:
      - .env
    volumes:
      - ./medical_record_service:/app
    depends_on:
      - postgres

  notification_service:
    build: ./notification_service
    ports:
      - "8007:8000"
    env_file:
      - .env
    volumes:
      - ./notification_service:/app
    depends_on:
      - postgres

  audit_service:
    build: ./audit_service
    ports:
      - "8008:8000"
    env_file:
      - .env
    volumes:
      - ./audit_service:/app
    depends_on:
      - postgres

  subscription_service:
    build: ./subscription_service
    ports:
      - "8009:8000"
    env_file:
      - .env
    volumes:
      - ./subscription_service:/app
    depends_on:
      - postgres

  insurance_service:
    build: ./insurance_service
    ports:
      - "8010:8000"
    env_file:
      - .env
    volumes:
      - ./insurance_service:/app
    depends_on:
      - postgres

volumes:
  postgres_data:
